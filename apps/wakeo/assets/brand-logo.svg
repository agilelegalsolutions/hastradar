<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none">
  <defs>
    <clipPath id="wakeoIconClip">
      <rect width="44" height="44" rx="11" />
    </clipPath>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem (Wakeo Official App Logo) -->
  <g transform="translate(4, 5)" filter="url(#iconShadow)">
    <g clip-path="url(#wakeoIconClip)">
      <image href="data:image/jpeg;base64," x="0" y="0" width="44" height="44" preserveAspectRatio="xMidYMid slice" />
    </g>
    <!-- Border matching brand theme -->
    <rect width="44" height="44" rx="11" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="58" y="28" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF" letter-spacing="-0.5">Wakeo</text>
  <circle cx="132" cy="18" r="3" fill="#F59E0B" />
  <text x="59" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#94A3B8" letter-spacing="1.2">BY HASTRADAR</text>
</svg>
