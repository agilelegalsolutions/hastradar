    <!-- Brick Wall Graphic inside Icon Tile -->
    <rect x="13.5" y="16" width="9.5" height="4.5" rx="1" fill="#FB923C"/>
    <rect x="25" y="16" width="12" height="4.5" rx="1" fill="#EA580C"/>
    <rect x="13.5" y="22" width="5" height="4.5" rx="1" fill="#F97316"/>
