<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="54" cy="54" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Pulse Ring Gradient -->
    <linearGradient id="pulseRingGrad" x1="22" y1="54" x2="78" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Inner Pulse Arc Gradient -->
    <linearGradient id="innerPulseGrad" x1="34" y1="66" x2="66" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Upward Growth Arrow Gradient -->
    <linearGradient id="growthArrowGrad" x1="32" y1="70" x2="78" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Navy Base Layer -->
  <rect width="108" height="108" rx="24" fill="#0A0F1D"/>

  <!-- Ambient Glowing Ring behind Emblem -->
  <path d="M 54,18 A 36,36 0 1,1 53.99,18 Z" stroke="url(#bgGlow)" stroke-width="14" stroke-opacity="0.35" fill="none"/>

  <!-- Subtle Metallic Crosslines -->
  <path d="M 18,54 L 90,54 M 54,18 L 54,90" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 3"/>

  <!-- Outer Pulse Ring -->
  <path d="M 22,54 A 32,32 0 1,1 78,28" stroke="url(#pulseRingGrad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>

  <!-- Inner Pulse Arc -->
  <path d="M 34,66 A 20,20 0 0,1 66,34" stroke="url(#innerPulseGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Upward Financial Growth Arrow -->
  <path d="M 32,70 L 48,54 L 58,62 L 78,36 M 66,36 L 79,34 L 77,48" stroke="url(#growthArrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)"/>

  <!-- AI Spark Star -->
  <path d="M 54,20 C 54,26 59,30 64,30 C 59,30 54,34 54,40 C 54,34 49,30 44,30 C 49,30 54,26 54,20 Z" fill="#D8B4FE"/>
</svg>
